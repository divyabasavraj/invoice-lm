[project]
name = "invoice-lm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Divya Basavraj", email = "divyabasavraj54@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "freetype-py>=2.5.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "uharfbuzz>=0.56.3",
]

[project.scripts]
invoice-lm = "invoice_lm:main"

[project.optional-dependencies]
train = [
    "mlx-vlm>=0.7.9",
]
api = [
    "fastapi>=0.154.0",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
